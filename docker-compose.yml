version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: pythia_db
    environment:
      POSTGRES_USER: pythia
      POSTGRES_PASSWORD: pythia_password
      POSTGRES_DB: pythia
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pythia"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: 